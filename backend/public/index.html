<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MZAZI TECH — Console</title>
<style>
:root{--bg:#05070a;--surface:#0b0f15;--elev:#111823;--line:#1c2634;--blue:#1b6bff;--cyan:#00d1ff;
--text:#f3f7ff;--muted:#93a3b8;--dim:#5f7085;--ok:#16c784;--warn:#ffb020;--bad:#ff4d5e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 8% -8%,rgba(27,107,255,.22),transparent 60%),
radial-gradient(700px 380px at 96% 0%,rgba(0,209,255,.12),transparent 55%),var(--bg);color:var(--text);
font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:12px}
.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--cyan));
display:grid;place-items:center;font-size:13px;color:#04101f;font-weight:800}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.card{background:linear-gradient(180deg,rgba(17,24,35,.92),rgba(11,15,21,.92));border:1px solid var(--line);
border-radius:16px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
h1{font-size:18px;margin:0 0 2px}h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid rgba(28,38,52,.55);font-size:12.5px}
tr:hover td{background:rgba(27,107,255,.05)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
.c-ok{background:rgba(22,199,132,.14);color:var(--ok)}.c-bad{background:rgba(255,77,94,.14);color:var(--bad)}
.c-warn{background:rgba(255,176,32,.14);color:var(--warn)}.c-info{background:rgba(27,107,255,.16);color:#7fb0ff}
.c-mute{background:rgba(95,112,133,.16);color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--elev);
color:var(--text);padding:7px 12px}
button:hover{border-color:#2b3d55}.primary{background:linear-gradient(135deg,var(--blue),#0a4fd0);border-color:#2f6dff;font-weight:600}
.ghost{background:transparent}.danger{color:var(--bad);border-color:rgba(255,77,94,.35)}
.sm{padding:4px 9px;font-size:11.5px}
input,select,textarea{font:inherit;background:#080c12;border:1px solid var(--line);color:var(--text);
border-radius:10px;padding:9px 11px;width:100%}
label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
nav button{border-radius:999px;padding:6px 14px;font-size:12px;background:transparent;color:var(--muted)}
nav button[aria-current="true"]{background:rgba(27,107,255,.16);border-color:#2f6dff;color:#bcd4ff}
.hidden{display:none!important}
.empty{padding:26px;text-align:center;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111823;border:1px solid var(--line);
padding:10px 16px;border-radius:12px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(470px,92vw)}
dialog::backdrop{background:rgba(2,4,8,.72)}
#login{max-width:380px;margin:9vh auto}.foot{margin:26px 0 8px;font-size:11px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<div id="toast"></div>
<section id="login" class="wrap">
  <div class="brand" style="justify-content:center;margin-bottom:18px"><span class="mark">M</span><span>MZAZI TECH INC</span></div>
  <div class="card">
    <h1>Operator console</h1>
    <p class="muted" style="margin:4px 0 14px">Sign in with your owner or seller account.</p>
    <form id="loginForm">
      <label>Email</label><input id="email" type="email" autocomplete="username" required />
      <label>Password</label><input id="password" type="password" autocomplete="current-password" required />
      <p id="loginError" class="hidden" style="color:var(--bad);font-size:12px;margin:10px 0 0"></p>
      <button class="primary" style="width:100%;margin-top:16px;padding:10px">Sign in</button>
    </form>
  </div>
</section>
<main id="app" class="wrap hidden">
  <header class="row between">
    <div class="brand"><span class="mark">M</span><span>MZAZI TECH</span></div>
    <div class="row" style="gap:10px">
      <span id="whoami" class="muted" style="font-size:12px"></span>
      <span id="roleChip" class="chip c-info"></span>
      <button class="ghost sm" id="logout">Sign out</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <div id="view"></div>
  <p class="foot">MZAZI TECH INC · automated bundle machine · <span id="footRole"></span></p>
</main>
<dialog id="modal"><form id="modalForm" method="dialog"><div id="modalBody"></div>
  <div class="row" style="justify-content:flex-end;margin-top:18px">
    <button class="ghost" type="button" id="modalCancel">Cancel</button>
    <button class="primary" id="modalOk">Save</button>
  </div></form></dialog>
<script>
(function(){
"use strict";
var API="/api/v1";
var state={token:sessionStorage.getItem("mzazi_token")||"",me:null,tab:"overview"};
var $=function(id){return document.getElementById(id)};
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var kes=function(c){return "KES "+(Number(c||0)/100).toLocaleString("en-KE",{minimumFractionDigits:2})};
var when=function(v){if(!v)return "—";var d=new Date(v);return isNaN(d)?"—":
  d.toLocaleString("en-KE",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})};
var isOwner=function(){return state.me&&state.me.role==="owner"};
function toast(m,bad){var t=$("toast");t.textContent=m;t.style.borderColor=bad?"rgba(255,77,94,.5)":"var(--line)";
  t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show")},2600)}
async function api(path,opts){
  opts=opts||{};var h={"Content-Type":"application/json"};
  if(state.token)h.Authorization="Bearer "+state.token;
  var res=await fetch(API+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  var text=await res.text();var data=text?JSON.parse(text):{};
  if(res.status===401){signOut();throw new Error("Session expired")}
  if(!res.ok){var e=new Error(data.error||data.message||("HTTP "+res.status));e.code=data.code;throw e}
  return data;
}
var CHIP={PAID:"c-ok",SUCCESS:"c-ok",PENDING:"c-warn",QUEUED:"c-info",RUNNING:"c-info",CLAIMED:"c-info",
  AWAITING_MANUAL_CONFIRMATION:"c-warn",FAILED:"c-bad",CANCELLED:"c-mute",REVERSED:"c-warn",REFUNDED:"c-warn",
  DEAD_LETTER:"c-bad",owner:"c-info",seller:"c-ok",ENABLED:"c-ok",DISABLED:"c-mute"};
var chip=function(v){return '<span class="chip '+(CHIP[v]||"c-mute")+'">'+esc(v||"—")+'</span>'};
var TABS=[{id:"overview",label:"Overview"},{id:"transactions",label:"Transactions"},
  {id:"queue",label:"Delivery queue"},{id:"bundles",label:"Bundles",owner:true},
  {id:"workflows",label:"USSD flows",owner:true},{id:"tills",label:"Tills",owner:true},
  {id:"sellers",label:"Sellers",owner:true},{id:"customers",label:"Customers",owner:true},
  {id:"devices",label:"Devices",owner:true},{id:"audit",label:"Audit",owner:true}];
function renderNav(){
  $("nav").innerHTML=TABS.filter(function(t){return !t.owner||isOwner()}).map(function(t){
    return '<button data-tab="'+t.id+'" aria-current="'+(state.tab===t.id)+'">'+t.label+'</button>'}).join("");
  Array.prototype.forEach.call($("nav").querySelectorAll("button"),function(b){
    b.onclick=function(){state.tab=b.dataset.tab;renderNav();load()}});
}
async function load(){
  var v=$("view");v.innerHTML='<div class="card empty">Loading…</div>';
  try{
    if(state.tab==="overview")await viewOverview(v);
    else if(state.tab==="transactions")await viewTransactions(v);
    else if(state.tab==="queue")await viewQueue(v);
    else if(state.tab==="bundles")await viewBundles(v);
    else if(state.tab==="workflows")await viewWorkflows(v);
    else if(state.tab==="tills")await viewTills(v);
    else if(state.tab==="sellers")await viewSellers(v);
    else if(state.tab==="customers")await viewCustomers(v);
    else if(state.tab==="devices")await viewDevices(v);
    else if(state.tab==="audit")await viewAudit(v);
  }catch(err){v.innerHTML='<div class="card"><p style="color:var(--bad);margin:0">'+esc(err.message)+'</p></div>'}
}
function kpi(l,val){return '<div class="card"><div class="v">'+esc(val)+'</div><div class="l">'+esc(l)+'</div></div>'}
function txTable(rows,actions){
  if(!rows.length)return '<div class="empty">No transactions yet.</div>';
  var head="<tr><th>Reference</th><th>Customer</th><th>Network</th><th>Bundle</th><th>Amount</th><th>Payment</th><th>Delivery</th><th>When</th>"+(actions?"<th></th>":"")+"</tr>";
  var body=rows.map(function(t){
    var btn=(actions&&t.paymentStatus==="PENDING")?'<button class="sm danger" data-cancel="'+esc(t.id)+'">Cancel</button>':"";
    return "<tr><td>"+esc(t.reference)+"</td><td>"+esc(t.customerMsisdn)+"</td><td>"+esc(t.network)+"</td><td>"+
      esc(t.bundleName)+"</td><td>"+kes(t.amountCents)+"</td><td>"+chip(t.paymentStatus)+"</td><td>"+
      chip(t.purchaseStatus)+"</td><td class=dim>"+when(t.createdAt)+"</td>"+(actions?"<td>"+btn+"</td>":"")+"</tr>"}).join("");
  return '<div style="overflow:auto"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}
async function viewOverview(v){
  var s=await api("/dashboard/summary");var tx=await api("/transactions?limit=8");
  v.innerHTML='<div class="row between" style="margin-bottom:12px"><h1>'+(isOwner()?"Owner overview":"Seller overview")+
    '</h1><span class="dim" style="font-size:11.5px">'+(isOwner()?"All activity":"Your activity")+'</span></div>'+
    '<div class="kpi">'+kpi("Today",kes(s.todayRevenueCents))+kpi("Lifetime",kes(s.totalSalesCents))+
    kpi("Successful",s.successfulTransactions)+kpi("Failed",s.failedTransactions)+
    kpi("Pending",s.pendingTransactions)+kpi("Orders",s.totalTransactions)+'</div>'+
    '<div class="card" style="margin-top:14px"><h2>Recent transactions</h2>'+txTable(tx,false)+'</div>';
}
async function viewTransactions(v){
  var rows=await api("/transactions?limit=100");
  v.innerHTML='<div class="row between" style="margin-bottom:12px"><h1>Transactions</h1><span class="dim" style="font-size:11.5px">'+
    rows.length+' shown</span></div><div class="card">'+txTable(rows,true)+'</div>';
  Array.prototype.forEach.call(v.querySelectorAll("[data-cancel]"),function(b){
    b.onclick=async function(){if(!confirm("Cancel this unpaid sale?"))return;
      try{await api("/transactions/"+b.dataset.cancel+"/cancel",{method:"POST"});toast("Cancelled");load()}
      catch(e){toast(e.message,true)}}});
}
async function viewQueue(v){
  var jobs=await api("/ussd/jobs?limit=100");
  if(!jobs.length){v.innerHTML='<div class="card empty">No delivery jobs queued.</div>';return}
  var rows=jobs.map(function(j){
    var act=j.status==="AWAITING_MANUAL_CONFIRMATION"?'<button class="sm" data-ok="'+esc(j.id)+'">Delivered</button> '+
      '<button class="sm danger" data-fail="'+esc(j.id)+'">Failed</button>':"";
    return "<tr><td>"+esc(j.network)+"</td><td>"+chip(j.status)+"</td><td>"+esc(j.attemptCount+"/"+j.maxAttempts)+
      "</td><td class=dim>"+esc(j.lastError||"—")+"</td><td class=dim>"+when(j.createdAt)+"</td><td>"+act+"</td></tr>"}).join("");
  v.innerHTML='<div class="card"><h2>USSD delivery queue</h2><table><thead><tr><th>Network</th><th>Status</th><th>Attempts</th>'+
    '<th>Last error</th><th>Created</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  var decide=async function(id,outcome){
    try{await api("/ussd/jobs/"+id+"/manual-confirmation",{method:"POST",body:{outcome:outcome,note:"Confirmed in console"}});
      toast("Recorded");load()}catch(e){toast(e.message,true)}};
  Array.prototype.forEach.call(v.querySelectorAll("[data-ok]"),function(b){b.onclick=function(){decide(b.dataset.ok,"DELIVERED")}});
  Array.prototype.forEach.call(v.querySelectorAll("[data-fail]"),function(b){b.onclick=function(){decide(b.dataset.fail,"FAILED")}});
}
async function viewBundles(v){
  var rows=await api("/bundles?includeDisabled=true");
  var body=rows.map(function(b){
    return "<tr><td>"+esc(b.name)+"</td><td>"+esc(b.network)+"</td><td>"+esc(b.dataSizeMb)+" MB</td><td>"+
      kes(b.sellingPriceCents)+"</td><td>"+(b.enabled?chip("ENABLED"):chip("DISABLED"))+"</td><td>"+
      '<button class="sm" data-toggle="'+esc(b.id)+'" data-on="'+b.enabled+'">'+(b.enabled?"Disable":"Enable")+"</button></td></tr>"}).join("");
  v.innerHTML='<div class="row between" style="margin-bottom:12px"><h1>Bundles</h1><button class="primary" id="addBundle">Add bundle</button></div>'+
    '<div class="card">'+(rows.length?'<table><thead><tr><th>Name</th><th>Network</th><th>Size</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>'+
      body+'</tbody></table>':'<div class="empty">No bundles configured.</div>')+'</div>';
  $("addBundle").onclick=function(){
    openModal("Add bundle",'<label>Network</label><select id="f_network"><option>SAFARICOM</option><option>AIRTEL</option><option>TELKOM</option></select>'+
      '<label>Name</label><input id="f_name" placeholder="1 GB Daily" /><label>Size (MB)</label><input id="f_size" type="number" value="1024" />'+
      '<label>Selling price (KES)</label><input id="f_price" type="number" value="100" />'+
      '<label>Cost price (KES)</label><input id="f_cost" type="number" value="0" />',
      async function(){await api("/bundles",{method:"POST",body:{network:$("f_network").value,name:$("f_name").value.trim(),
        dataSizeMb:Number($("f_size").value),sellingPriceCents:Math.round(Number($("f_price").value)*100),
        costPriceCents:Math.round(Number($("f_cost").value)*100),enabled:true}});toast("Bundle added");load()})};
  Array.prototype.forEach.call(v.querySelectorAll("[data-toggle]"),function(b){
    b.onclick=async function(){try{await api("/bundles/"+b.dataset.toggle,{method:"PATCH",body:{enabled:b.dataset.on!=="true"}});
      toast("Updated");load()}catch(e){toast(e.message,true)}}});
}
async function viewWorkflows(v){
  var rows=await api("/workflows");
  var body=rows.map(function(w){
    var steps=(w.steps||[]).map(function(s){return esc(s.requestTemplate)}).join(" → ")||"—";
    return "<tr><td>"+esc(w.name)+"</td><td>"+esc(w.network)+"</td><td class=dim style='max-width:320px'>"+steps+"</td><td>"+
      (w.enabled?chip("ENABLED"):chip("DISABLED"))+"</td><td>"+esc(w.verifiedBy||"—")+"</td></tr>"}).join("");
  v.innerHTML='<div class="row between" style="margin-bottom:12px"><h1>USSD flows</h1><button class="primary" id="addFlow">Add verified flow</button></div>'+
    '<p class="dim" style="font-size:11.5px;margin:-4px 0 10px">Enter only codes confirmed by the operator. New flows are saved disabled until a verifier is recorded.</p>'+
    '<div class="card">'+(rows.length?'<table><thead><tr><th>Name</th><th>Network</th><th>Steps</th><th>Status</th><th>Verified by</th></tr></thead><tbody>'+
      body+'</tbody></table>':'<div class="empty">No flows configured.</div>')+'</div>';
  $("addFlow").onclick=function(){
    openModal("Add verified USSD flow",'<label>Network</label><select id="w_network"><option>SAFARICOM</option><option>AIRTEL</option><option>TELKOM</option></select>'+
      '<label>Name</label><input id="w_name" placeholder="Safaricom daily bundles" />'+
      '<label>Steps, one per line</label><textarea id="w_steps" rows="3" placeholder="*100*{amount}#"></textarea>'+
      '<label>Success regex</label><input id="w_success" placeholder="(?i)(successful|activated)" />'+
      '<label>Failure regex</label><input id="w_failure" placeholder="(?i)(failed|insufficient)" />'+
      '<label>Verified by</label><input id="w_verifier" placeholder="Operator or engineer name" />',
      async function(){
        var lines=$("w_steps").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
        await api("/workflows",{method:"POST",body:{network:$("w_network").value,name:$("w_name").value.trim(),
          steps:lines.map(function(code,i){return {index:i,label:"Step "+(i+1),requestTemplate:code}}),
          successPattern:$("w_success").value.trim()||undefined,failurePattern:$("w_failure").value.trim()||undefined,
          verifiedBy:$("w_verifier").value.trim()||undefined,enabled:false}});toast("Flow saved (disabled)");load()})};
}
async function viewTills(v){
  var rows=await api("/admin/tills");
  var body=rows.map(function(t){
    return "<tr><td>"+esc(t.label)+"</td><td>"+esc(t.network)+"</td><td>"+esc(t.shortcode)+"</td><td>"+esc(t.accountType)+"</td><td>"+
      (t.hasPasskey?'<span class="chip c-ok">set '+esc(t.passkeyHint||"")+'</span>':'<span class="chip c-warn">no passkey</span>')+
      "</td><td>"+(t.isDefault?chip("ENABLED"):chip("DISABLED"))+"</td><td>"+
      (t.enabled?'<button class="sm danger" data-off="'+esc(t.id)+'">Disconnect</button>':'<span class="dim">off</span>')+"</td></tr>"}).join("");
  v.innerHTML='<div class="row between" style="margin-bottom:12px"><h1>Tills</h1><button class="primary" id="addTill">Connect till</button></div>'+
    '<p class="dim" style="font-size:11.5px;margin:-4px 0 10px">Payments collect on the default till for the customer\u2019s network. Passkeys are encrypted at rest and never returned.</p>'+
    '<div class="card">'+(rows.length?'<table><thead><tr><th>Label</th><th>Network</th><th>Shortcode</th><th>Type</th><th>Passkey</th><th>Default</th><th></th></tr></thead><tbody>'+
      body+'</tbody></table>':'<div class="empty">No tills connected. Payments will fail until one is added.</div>')+'</div>';
  $("addTill").onclick=function(){
    openModal("Connect M-Pesa till",'<label>Network</label><select id="t_network"><option>SAFARICOM</option><option>AIRTEL</option><option>TELKOM</option></select>'+
      '<label>Label</label><input id="t_label" placeholder="Safaricom main till" />'+
      '<label>Shortcode</label><input id="t_short" placeholder="43210" inputmode="numeric" />'+
      '<label>Type</label><select id="t_type"><option>TILL</option><option>PAYBILL</option></select>'+
      '<label>Paybill account (optional)</label><input id="t_acct" placeholder="MZAZI" />'+
      '<label>Passkey</label><input id="t_pass" type="password" />'+
      '<label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="t_default" type="checkbox" checked style="width:auto"/> Default for this network</label>',
      async function(){await api("/admin/tills",{method:"POST",body:{network:$("t_network").value,label:$("t_label").value.trim(),
        shortcode:$("t_short").value.trim(),accountType:$("t_type").value,accountNumber:$("t_acct").value.trim()||null,
        passkey:$("t_pass").value||undefined,isDefault:$("t_default").checked}});toast("Till connected");load()})};
  Array.prototype.forEach.call(v.querySelectorAll("[data-off]"),function(b){
    b.onclick=async function(){if(!confirm("Disconnect this till?"))return;
      try{await api("/admin/tills/"+b.dataset.off,{method:"DELETE"});toast("Disconnected");load()}catch(e){toast(e.message,true)}}});
}
async function viewSellers(v){
  var rows=await api("/admin/sellers");
  var body=rows.map(function(s){
    return "<tr><td>"+esc(s.name)+"</td><td>"+esc(s.email)+"</td><td>"+chip(s.role)+"</td><td>"+
      (s.disabled?chip("FAILED"):chip("ENABLED"))+"</td><td class=dim>"+when(s.lastLoginAt)+"</td><td>"+
      (s.role==="seller"?'<button class="sm danger" data-dis="'+esc(s.id)+'">Disable</button>':"")+"</td></tr>"}).join("");
  v.innerHTML='<div class="row between" style="margin-bottom:12px"><h1>Sellers</h1><button class="primary" id="addSeller">Add seller</button></div>'+
    '<div class="card">'+(rows.length?'<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead><tbody>'+
      body+'</tbody></table>':'<div class="empty">No accounts yet.</div>')+'</div>';
  $("addSeller").onclick=function(){
    openModal("Add seller",'<label>Name</label><input id="s_name" placeholder="Njeri Kamau" />'+
      '<label>Email</label><input id="s_email" type="email" placeholder="seller@mzazi.shop" />'+
      '<label>Password</label><input id="s_pass" type="password" placeholder="Minimum 8 characters" />'+
      '<p class="dim" style="font-size:11.5px;margin-top:12px">Sellers sell and see only their own sales. They cannot change bundles, flows, tills or accounts.</p>',
      async function(){await api("/admin/sellers",{method:"POST",body:{name:$("s_name").value.trim(),
        email:$("s_email").value.trim(),password:$("s_pass").value}});toast("Seller added");load()})};
  Array.prototype.forEach.call(v.querySelectorAll("[data-dis]"),function(b){
    b.onclick=async function(){if(!confirm("Disable this seller?"))return;
      try{await api("/admin/sellers/"+b.dataset.dis,{method:"PATCH",body:{disabled:true}});toast("Seller disabled");load()}
      catch(e){toast(e.message,true)}}});
}
async function viewCustomers(v){
  var rows=await api("/admin/customers?limit=200");
  var body=rows.map(function(c){
    return "<tr><td>"+esc(c.msisdn)+"</td><td>"+esc(c.orders)+"</td><td>"+esc(c.delivered)+"</td><td>"+kes(c.spentCents)+
      "</td><td>"+esc((c.networks||[]).join(", "))+"</td><td class=dim>"+when(c.lastOrderAt)+"</td></tr>"}).join("");
  v.innerHTML='<div class="row between" style="margin-bottom:12px"><h1>Customers</h1><span class="dim" style="font-size:11.5px">'+
    rows.length+' buyers</span></div><div class="card">'+(rows.length?'<table><thead><tr><th>Number</th><th>Orders</th><th>Delivered</th><th>Spent</th><th>Networks</th><th>Last order</th></tr></thead><tbody>'+
      body+'</tbody></table>':'<div class="empty">No customers yet.</div>')+'</div>';
}
async function viewDevices(v){
  var rows=(await api("/admin/devices")).devices||[];
  var body=rows.map(function(d){
    return "<tr><td>"+esc(d.label)+"</td><td class=dim>"+esc(d.id)+"</td><td>"+(d.enabled?chip("ENABLED"):chip("DISABLED"))+
      "</td><td class=dim>"+when(d.lastSeenAt)+"</td></tr>"}).join("");
  v.innerHTML='<div class="card"><h2>Paired terminals</h2>'+(rows.length?'<table><thead><tr><th>Label</th><th>Device ID</th><th>Status</th><th>Last seen</th></tr></thead><tbody>'+
    body+'</tbody></table>':'<div class="empty">No terminals paired.</div>')+'</div>';
}
async function viewAudit(v){
  var logs=(await api("/admin/audit-logs?limit=100")).logs||[];
  var body=logs.map(function(l){
    return "<tr><td class=dim>"+when(l.createdAt)+"</td><td>"+esc(l.actorType)+"</td><td>"+esc(l.action)+
      "</td><td class=dim>"+esc(l.target||"—")+"</td></tr>"}).join("");
  v.innerHTML='<div class="card"><h2>Audit trail</h2>'+(logs.length?'<table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th></tr></thead><tbody>'+
    body+'</tbody></table>':'<div class="empty">No entries.</div>')+'</div>';
}
function openModal(title,fields,onSubmit){
  $("modalBody").innerHTML="<h2>"+esc(title)+"</h2>"+fields;
  var dlg=$("modal");$("modalCancel").onclick=function(){dlg.close()};
  $("modalForm").onsubmit=async function(ev){ev.preventDefault();var ok=$("modalOk");ok.disabled=true;
    try{await onSubmit();dlg.close()}catch(e){toast(e.message,true)}finally{ok.disabled=false}};
  dlg.showModal();
}
function signOut(){state.token="";state.me=null;sessionStorage.removeItem("mzazi_token");
  $("app").classList.add("hidden");$("login").classList.remove("hidden");$("view").innerHTML="";$("nav").innerHTML=""}
async function boot(){
  if(!state.token){signOut();return}
  try{
    state.me=await api("/auth/me");
    $("whoami").textContent=state.me.email;
    $("roleChip").textContent=state.me.role;
    $("roleChip").className="chip "+(isOwner()?"c-info":"c-ok");
    $("footRole").textContent=isOwner()?"owner session":"seller session";
    $("login").classList.add("hidden");$("app").classList.remove("hidden");
    state.tab="overview";renderNav();load();
  }catch(e){signOut()}
}
$("loginForm").onsubmit=async function(ev){
  ev.preventDefault();var err=$("loginError");err.classList.add("hidden");
  try{
    var res=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});
    var data=await res.json();
    if(!res.ok)throw new Error(data.error||"Sign-in failed");
    state.token=data.accessToken;sessionStorage.setItem("mzazi_token",data.accessToken);
    $("password").value="";await boot();
  }catch(e){err.textContent=e.message;err.classList.remove("hidden")}
};
$("logout").onclick=signOut;
boot();
})();
</script>
</body>
