# Heap sizes are deliberately conservative: CI containers for this project have 4 GB
# total, and an oversized Kotlin daemon gets OOM-killed during KSP/Room code generation.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.enableJetifier=false
kotlin.incremental=true
